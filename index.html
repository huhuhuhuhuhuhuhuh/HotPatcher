<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>二郎神 · 战神降世</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <div class="game-header">
            <div class="player-stats">
                <div class="stat-row">
                    <span class="stat-icon">❤️</span>
                    <div class="stat-bar">
                        <div class="stat-fill hp" id="hpBar"></div>
                    </div>
                    <span class="stat-value" id="hpText">100/100</span>
                </div>
                <div class="stat-row">
                    <span class="stat-icon">⚡</span>
                    <div class="stat-bar">
                        <div class="stat-fill mp" id="mpBar"></div>
                    </div>
                    <span class="stat-value" id="mpText">50/50</span>
                </div>
            </div>
            <div class="game-title">
                <span class="title-main">二郎神</span>
                <span class="title-sub">战神降世</span>
            </div>
            <div class="player-info">
                <div class="level-badge">等级 <span id="level">1</span></div>
                <div class="gold-display">💰 <span id="gold">0</span></div>
            </div>
        </div>
        
        <canvas id="gameCanvas" width="800" height="500"></canvas>
        
        <div class="game-footer">
            <div class="location-info">
                <span class="location-icon">📍</span>
                <span id="locationName">花果山</span>
            </div>
            <div class="skills-bar">
                <div class="skill-slot" id="skill1" title="普通攻击">
                    <span class="skill-key">J</span>
                    <span class="skill-name">攻击</span>
                </div>
                <div class="skill-slot" id="skill2" title="天眼">
                    <span class="skill-key">K</span>
                    <span class="skill-name">天眼</span>
                    <span class="skill-mp">10MP</span>
                </div>
                <div class="skill-slot" id="skill3" title="八九玄功">
                    <span class="skill-key">L</span>
                    <span class="skill-name">玄功</span>
                    <span class="skill-mp">20MP</span>
                </div>
                <div class="skill-slot" id="skill4" title="哮天犬">
                    <span class="skill-key">空格</span>
                    <span class="skill-name">啸天犬</span>
                    <span class="skill-mp">25MP</span>
                </div>
            </div>
            <div class="equip-display">
                <div class="equip-slot" title="武器">
                    <span id="weaponIcon">⚔️</span>
                </div>
                <div class="equip-slot" title="防具">
                    <span id="armorIcon">🛡️</span>
                </div>
                <div class="equip-slot" title="饰品">
                    <span id="accessoryIcon">💍</span>
                </div>
            </div>
        </div>
        
        <div class="map-select" id="mapSelect" style="display:none;">
            <h2>选择地图</h2>
            <div class="map-list">
                <button class="map-btn" data-map="huaguo">🌸 花果山 <span class="map-level">Lv.1+</span></button>
                <button class="map-btn" data-map="qitian">⛰️ 齐云洞 <span class="map-level">Lv.5+</span></button>
                <button class="map-btn" data-map="nuvo">🔥 火焰山 <span class="map-level">Lv.10+</span></button>
                <button class="map-btn" data-map="water">🌊 龙宫 <span class="map-level">Lv.15+</span></button>
                <button class="map-btn" data-map="heaven">☁️ 天庭 <span class="map-level">Lv.20+</span></button>
            </div>
            <button class="close-btn" onclick="closeMapSelect()">关闭</button>
        </div>
    </div>
    
    <script src="game.js"></script>
</body>
</html>

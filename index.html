<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>二郎神闯关传</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <div class="game-header">
            <div class="player-info">
                <span class="player-name">二郎神 · 杨戬</span>
                <div class="health-bar">
                    <div class="health-fill" id="health"></div>
                </div>
                <span class="health-text" id="healthText">100/100</span>
            </div>
            <div class="game-title">二郎神闯关传</div>
            <div class="level-info">
                <span class="level-label">关卡</span>
                <span class="level-value" id="level">1</span>
            </div>
        </div>
        
        <canvas id="gameCanvas" width="900" height="500"></canvas>
        
        <div class="game-footer">
            <div class="controls">
                <h3>操作说明</h3>
                <p>← → 移动</p>
                <p>↑ 跳跃 / 腾云</p>
                <p>J 三尖两刃刀</p>
                <p>K 天眼</p>
                <p>L 八九玄功</p>
                <p>空格 召唤啸天犬</p>
            </div>
            <div class="game-status" id="gameStatus">准备战斗!</div>
            <div class="skills">
                <div class="skill" id="skillEye">
                    <span class="skill-icon">👁️</span>
                    <span class="skill-name">天眼</span>
                    <span class="skill-cooldown" id="cooldownEye">0</span>
                </div>
                <div class="skill" id="skillTransform">
                    <span class="skill-icon">🐉</span>
                    <span class="skill-name">八九玄功</span>
                    <span class="skill-cooldown" id="cooldownTransform">0</span>
                </div>
                <div class="skill" id="skillDog">
                    <span class="skill-icon">🐕</span>
                    <span class="skill-name">啸天犬</span>
                    <span class="skill-cooldown" id="cooldownDog">0</span>
                </div>
            </div>
        </div>
        
        <button id="restartBtn" class="restart-btn">重新开始</button>
        <button id="nextLevelBtn" class="next-level-btn">下一关</button>
    </div>
    
    <script src="game.js"></script>
</body>
</html>
